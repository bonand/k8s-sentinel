# path: pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-sentinel"
version = "0.1.0"
description = "AI Agent for Kubernetes incident response on Active Graph"
requires-python = ">=3.11"
dependencies = [
    "activegraph",
    "kubernetes>=29.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "ruff>=0.3.0", "mypy>=1.8.0"]

[project.entry-points."activegraph.packs"]
k8s_sentinel = "k8s_sentinel.pack:k8s_sentinel_pack"

[tool.setuptools.packages.find]
include = ["k8s_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
