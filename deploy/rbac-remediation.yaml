# path: deploy/rbac-remediation.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: k8s-sentinel-remediation }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
